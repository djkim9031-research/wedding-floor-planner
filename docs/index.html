background:#fff;color:var(--ink);min-width:0;flex:1}.sun-slider{width:100%;accent-color:var(--brass)}.cloud-slider{flex:1}.sun-pct{font-size:11px;color:#8d8478;min-width:30px;text-align:right}.sun-info{font-size:11px;color:#8d8478}.items-panel{position:absolute;right:12px;top:110px;width:226px;background:var(--ivory);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;z-index:10;display:flex;flex-direction:column}.items-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--serif);font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--hairline)}.items-head .ui-btn{font-size:11.5px;min-height:28px;padding:4px 8px}.items-list{overflow-y:auto;max-height:calc(100vh - 460px);min-height:40px;margin-top:4px}.item-row{display:flex;align-items:center;gap:2px;border-radius:7px}.item-row.selected{background:#b08d5729}.item-label{appearance:none;border:none;background:transparent;color:var(--ink);font:inherit;flex:1;text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-label:hover{background:#b08d571a}.item-row .row-del{flex:0 0 auto;min-height:28px;min-width:28px;padding:2px 6px}.status-panel{position:absolute;right:12px;bottom:14px;width:250px;background:var(--ivory);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;z-index:10}.status-panel h3{font-family:var(--serif);font-weight:600;font-size:14px;margin-bottom:2px}.status-panel .sub{color:#8d8478;font-size:11.5px;margin-bottom:6px}.status-panel .hint{color:#8d8478;font-size:11.5px;line-height:1.45}.drape-list{list-style:none;margin-top:6px;border-top:1px solid var(--hairline);padding-top:6px}.drape-list li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.drape-list .side{color:#8d8478}.drape-list .val{text-align:right}.drape-note{margin-top:6px;font-     <div id="app"></div>
    <script>
      // boot diagnostics: a silent white page is useless — name the failure
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boot-error';
            el.style.cssText =
              'position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fff8f0;' +
              'border:2px solid #b4655a;border-radius:10px;padding:14px 16px;color:#4a443d;' +
              'font:13px/1.5 system-ui,sans-serif;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.2)';
            el.textContent = 'The 3D planner could not start.\n\n';
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent += '• ' + msg + '\n';
        }
        window.__wpShowBootError = show;
        window.addEventListener('error', function (e) {
          show((e.message || 'script error') + (e.filename ? '  [' + e.filename.split('/').pop() + ':' + e.lineno + ']' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('unhandled: ' + String(e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        document.addEventListener('DOMContentLoaded', function () {
          var c = document.createElement('canvas');
          var gl = null;
          try {
            gl = c.getContext('webgl2');
          } catch (err) {
            /* fall through */
          }
          if (!gl) {
            show(
              'WebGL2 is not available in this browser, so the 3D view cannot render.\n' +
                '  1. Chrome: chrome://settings/system → enable "Use graphics acceleration when available" → Relaunch.\n' +
                '  2. Still blank? chrome://flags/#ignore-gpu-blocklist → Enabled → Relaunch (Linux drivers are often blocklisted).\n' +
                '  3. Or try Firefox on this machine — or open this link on your phone (phones always have WebGL2).\n' +
                '  Browser: ' + navigator.userAgent,
            );
          }
        });
        setTimeout(function () {
          if (!window.__wpBooted) {
            show('The app did not finish starting within 8 seconds (no render yet). Browser: ' + navigator.userAgent);
          }
        }, 8000);
      })();
    </script>
