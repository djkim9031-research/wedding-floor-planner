          if (!el) {

                '  1. Chrome: chrome://settings/system → enable "Use graphics acceleration when available" → Relaunch.\n' +

          if (!window.__wpBooted) {
            show('The app did not finish starting within 8 seconds (no render yet). Browser: ' + navigator.userAgent);
          }
